<style>
  :root { color-scheme: dark; --wall: #070708; --ink: #cfc8b8; --dim: #7d7668; --line: #24221f; --lamp: #f2a03d; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--wall); color: var(--ink); font-family: Georgia, 'Iowan Old Style', 'Times New Roman', serif; }
  main { max-width: 46rem; margin: 0 auto; padding: 3.5rem 16px 4rem; }
  header { margin-bottom: 3rem; }
  h1 { margin: 0; font-weight: normal; font-size: 1.9rem; letter-spacing: 0.02em; }
  header p { margin: 0.6rem 0 0; color: var(--dim); line-height: 1.55; max-width: 34rem; }
  figure { margin: 0; }
  figure a.picture { display: block; }
  img { display: block; width: 100%; height: auto; box-shadow: 0 0 0 1px #000, 0 18px 60px #000; }
  figcaption { margin-top: 1.2rem; display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.4rem 1.5rem; }
  figcaption .name { font-size: 1.25rem; }
  figcaption .what { color: var(--dim); font-size: 0.92rem; }
  .watch { display: inline-block; margin-top: 1.1rem; color: var(--ink); border: 1px solid var(--line); padding: 0.45rem 0.9rem; border-radius: 2px; text-decoration: none; font-size: 0.95rem; }
  .watch:hover { border-color: var(--lamp); }
  .rule { margin: 1.6rem 0 0; color: var(--dim); line-height: 1.6; border-left: 2px solid var(--line); padding-left: 0.9rem; max-width: 36rem; }
  footer { margin-top: 4rem; color: var(--dim); font-size: 0.85rem; }

<body>
<main>
  <header>
    <h1>Atelier</h1>
    <p>A place where Claude paints. Each painting is written down one stroke per line, and every line is placed by hand.</p>
  </header>
  <figure>
    <a class="picture" href="paintings/three-hours/index.html"><img src="paintings/three-hours/three-hours-small.png" width="800" height="1000" alt="A night sky of star trails turning about the Pole Star, over a dark house with one lit window whose light rakes down a slope toward a glowing tide line"></a>
    <figcaption>
      <span class="name">Three Hours</span>
      <span class="what">2026 &middot; 1,176 strokes</span>
    </figcaption>
    <p class="rule">Only what moves is painted. A stroke is the way something went during the three hours: it starts loaded where the thing is now and runs dry backward into where it has been. What kept still is bare canvas.</p>
    <a class="watch" href="paintings/three-hours/index.html">Watch it being painted</a>
  </figure>
  <footer>
    <a href="https://github.com/gabriel-berzescu/atelier">The brush and the scores</a> &middot; the island is <a href="https://gabriel-berzescu.github.io/ebb/">Ebb</a>
  </footer>
</main>
